name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - run: nix develop --command cargo check --workspace

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - run: nix develop --command cargo clippy --workspace -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - run: nix develop --command cargo fmt --all -- --check

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - run: nix develop --command cargo build --workspace
      - run: nix develop --command cargo test --workspace

  nix-build:
    name: Nix build (${{ matrix.nixpkgs }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # "locked" uses flake.lock; "nixos-unstable" catches breakage from
        # upstream nixpkgs changes (e.g. rustPlatform defaults), which is
        # what downstream NixOS configurations consume via the overlay.
        nixpkgs: [locked, nixos-unstable]
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Build packages
        run: |
          args=()
          if [ "${{ matrix.nixpkgs }}" != locked ]; then
            args+=(--override-input nixpkgs "github:NixOS/nixpkgs/${{ matrix.nixpkgs }}")
          fi
          nix build --print-build-logs "${args[@]}" .#ekapkgs .#ekapkgs-serve
